spring:
  profiles:
    active: prod
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jackson:
    serialization:
      write-dates-as-timestamps: false
  ai:
    ollama:
      host: http://localhost:11434
      model: llama2
#      temperature: 0.5
#      max-tokens: 1024
      embedding:
        model: nomic-embed-text-v2-moe

logging:
  level:
    org:
      example: DEBUG
      springframework:
        security: DEBUG
        web: DEBUG
server:
  error:
    include-message: always
    include-stacktrace: always
  tomcat:
    accesslog:
      enabled: true
security:
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY}

    refresh-token:
      expiration: 604800000


youtube:
  api:
    key: ${YOUTUBE_API_KEY:}
